# The plugin's own CI. It cannot use itself to release -- it has no npm package
# -- so this only lints and tests.
steps:
  - label: ':bash: shellcheck'
    command: |
      docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable \
        hooks/post-command lib/*.sh tests/*.sh
    agents:
      queue: linux-small

  - label: ':test_tube: is-version-pr fixtures'
    command: tests/fixtures.sh
    agents:
      queue: linux-small

  - label: ':test_tube: generated step reference'
    command: tests/upload-step.sh
    agents:
      queue: linux-small

  - label: ':test_tube: release hook fixtures'
    command: bash tests/release.sh
    agents:
      queue: linux-small
